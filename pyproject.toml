[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "assay-graph"
version = "0.1.0"
description = "Assay: content-addressed evidence graphs for accountable AI-assisted software delivery. Claims that decay with the code."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "Apache-2.0"}
authors = [{name = "Om Shankar Tiwari"}]
keywords = ["ai-agents", "code-index", "provenance", "merkle", "code-review", "mcp", "accountability"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]
experiments = ["matplotlib", "networkx", "numpy", "tiktoken"]

[project.scripts]
assay = "assay.cli:main"

[project.urls]
Homepage = "https://github.com/OmShiv/assay-research"
Repository = "https://github.com/OmShiv/assay-research"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
